[versions]
androidGradlePlugin = "8.9.1"
androidTools = "31.9.0"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"

junit = "5.12.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"

robolectric = "4.14.1"

androidxLintGradle = "1.0.0-alpha03"
androidxAnnotation = "1.9.1"
androidxCore = "1.15.0"
androidxAppcompat = "1.7.0"
androidxActivity = "1.9.3"
androidxConstraintlayout = "2.2.0"
androidxFragment = "1.8.5"
androidxRecyclerview = "1.3.2"
androidxViewpager = "1.0.0"
androidxViewpager2 = "1.1.0"
material = "1.12.0"
desugarJdkLibs = "2.1.5"
metalavaGradle = "0.5.1"

gson = "2.11.0"
fastjson = "1.2.83"
fastjson2 = "2.0.57"

[libraries]
androidx-lint-gradle = { group = "androidx.lint", name = "lint-gradle", version.ref = "androidxLintGradle" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-viewpager = { group = "androidx.viewpager", name = "viewpager", version.ref = "androidxViewpager" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidxViewpager2" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
fastjson = { group = "com.alibaba", name = "fastjson", version.ref = "fastjson" }
fastjson2 = { group = "com.alibaba.fastjson2", name = "fastjson2", version.ref = "fastjson2" }


# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }


junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-lint = { id = "com.android.lint", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
metalava = { id = "me.tylerbwong.gradle.metalava", version.ref = "metalavaGradle" }

# Plugins defined by this project
convention-android-application = { id = "convention.android.application" }
convention-android-library = { id = "convention.android.library" }
convention-android-lint = { id = "convention.android.lint" }

